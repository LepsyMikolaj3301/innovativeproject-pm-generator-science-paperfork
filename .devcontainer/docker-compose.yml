services:
  spark-jupyter:
    image: genpm/spark-jupyter:latest
    container_name: genpm-spark
    env_file:
      - ../.env
    build:
      context: ..
      dockerfile: build/Spark.Dockerfile
      args:
        USER_UID: 1000
        USER_GID: 1000
        USERNAME: devuser
    volumes:
      - ..:/home/devuser/app:cached
    command: sleep infinity
    networks:
      - genpm-network

networks:
  genpm-network:
    name: genpm-network
    driver: bridge
