services:
  frontend:
    image: node:22-alpine
    container_name: genpm-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ../apps/frontend:/app
      - ../shared:/app/shared:ro
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      VITE_KEYCLOAK_ADMIN_ROLE: ${KEYCLOAK_ADMIN_ROLE:-admin}
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - genpm-network
    depends_on:
      - fastapi
      - keycloak

  spark-jupyter:
    image: genpm/spark-jupyter:latest
    container_name: genpm-spark
    hostname: genpm-spark
    build:
      context: ..
      dockerfile: build/Spark.Dockerfile
      args:
        USER_UID: 1000
        USER_GID: 1000
        USERNAME: devuser
    ports:
      - "4041:4041"
      - "18080:18080"
      - "4040:4040"
      - "7077:7077"
    volumes:
      - ../apps/generator:/home/devuser/app/apps/generator
      - ../shared:/app/shared:ro
      - ../apps/generator/apps:/opt/airflow/spark-apps
    env_file:
      - ../.env
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_ENDPOINT=${S3_URL}
      - GENPM_SCHEMA_PATH=/app/shared/pm_schema_columns.json
    networks:
      - genpm-network

  fastapi:
    image: genpm/fastapi:latest
    container_name: genpm-fastapi
    build:
      context: ..
      dockerfile: build/FastAPI.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../apps/backend/app:/app/app
      - ../shared:/app/shared:ro
    env_file:
      - ../.env
    environment:
      GENPM_SCHEMA_PATH: /app/shared/pm_schema_columns.json
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AIRFLOW_URL: ${AIRFLOW_URL:-http://genpm-airflow-apiserver:9005}
      AIRFLOW_API_PREFIX: ${AIRFLOW_API_PREFIX:-/api/v2}
      AIRFLOW_AUTH_TOKEN_PATH: ${AIRFLOW_AUTH_TOKEN_PATH:-/auth/token}
      AIRFLOW_USERNAME: ${AIRFLOW_USERNAME:-airflow}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD:-airflow}
      AIRFLOW_HTTP_TIMEOUT_SECONDS: ${AIRFLOW_HTTP_TIMEOUT_SECONDS:-15}
      LOG_STREAM_MAX_DURATION_SECONDS: ${LOG_STREAM_MAX_DURATION_SECONDS:-7200}
      LOG_STREAM_HEARTBEAT_SECONDS: ${LOG_STREAM_HEARTBEAT_SECONDS:-15}
      DAG_LIST_CACHE_SECONDS: ${DAG_LIST_CACHE_SECONDS:-30}
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL}
      KEYCLOAK_ISSUER_URL: http://localhost:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_REQUIRED_ROLES: ${KEYCLOAK_REQUIRED_ROLES}
      KEYCLOAK_ADMIN_ROLE: ${KEYCLOAK_ADMIN_ROLE:-admin}
      FRONTEND_ORIGIN: http://localhost:5173
      S3_URL: ${S3_URL}
      S3_EXTERNAL_URL: ${S3_EXTERNAL_URL}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app
    networks:
      - genpm-network
    depends_on:
      - postgres
      - keycloak

  postgres:
    image: postgres:16-alpine
    container_name: genpm-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - genpm-network

  minio:
    image: quay.io/minio/minio:latest
    container_name: genpm-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    command: server /data --console-address ":9001"
    networks:
      genpm-network:
        aliases:
          - minio
    volumes:
      - minio_data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    container_name: genpm-keycloak
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    command: start-dev --import-realm
    volumes:
      - ../infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak_data:/opt/keycloak/data
    networks:
      - genpm-network

volumes:
  frontend_node_modules:
  postgres_data:
  keycloak_data:
  minio_data:

networks:
  genpm-network:
    name: genpm-network
    driver: bridge
